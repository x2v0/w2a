<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатория загрузки</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #f5f3eb; color: #333; }
        .btn { display: block; width: 100%; margin-bottom: 10px; padding: 15px; background: #0288d1; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #aaa; }
        #result { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ccc; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 14px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        a { color: #0288d1; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Загрузка orcid_works.json</h2>
    <div id="menu">
        <button onclick="run(1)" class="btn">1. Fetch API</button>
        <button onclick="run(2)" class="btn">2. XMLHttpRequest</button>
        <button onclick="run(3)" class="btn">3. Script Tag (JSONP)</button>
        <button onclick="run(4)" class="btn">4. LocalStorage (Кэш)</button>
        <button onclick="run(5)" class="btn">5. Iframe</button>
    </div>
    <div id="result">Выберите метод...</div>
    <p style="text-align: center; margin-top: 20px;"><a href="./index.html">← Назад на главную</a></p>

    <script>
        const resultDiv = document.getElementById('result');
        
        function showResult(html) {
            resultDiv.innerHTML = html;
        }

        function run(m) {
            showResult("Загрузка...");
            const startTime = performance.now();

            if (m === 1) {
                // Метод 1: Fetch
                fetch('./orcid_works.json')
                    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(data => {
                        const time = (performance.now() - startTime).toFixed(1);
                        showResult('<span class="success">✓ Успех (Fetch)!</span>\nПубликаций: ' + data.group.length + '\nВремя: ' + time + 'мс');
                    })
                    .catch(err => showResult('<span class="error">✗ Ошибка Fetch:</span>\n' + err.message));
            }
            else if (m === 2) {
                // Метод 2: XHR
                const xhr = new XMLHttpRequest();
                xhr.open('GET', './orcid_works.json', true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        const time = (performance.now() - startTime).toFixed(1);
                        if (xhr.status === 200 || xhr.status === 0) {
                            try {
                                const data = JSON.parse(xhr.responseText);
                                showResult('<span class="success">✓ Успех (XHR)!</span>\nПубликаций: ' + data.group.length + '\nВремя: ' + time + 'мс');
                            } catch(e) {
                                showResult('<span class="error">✗ Ошибка парсинга:</span>\n' + e.message);
                            }
                        } else {
                            showResult('<span class="error">✗ Ошибка XHR:</span>\nСтатус ' + xhr.status);
                        }
                    }
                };
                xhr.send();
            }
            else if (m === 3) {
                // Метод 3: Script Tag
                const script = document.createElement('script');
                script.src = './orcid_works.js';
                script.onload = () => {
                    const time = (performance.now() - startTime).toFixed(1);
                    if (window.orcidDataJS) {
                        showResult('<span class="success">✓ Успех (Script)!</span>\nПубликаций: ' + window.orcidDataJS.group.length + '\nВремя: ' + time + 'мс');
                    } else {
                        showResult('<span class="error">✗ Скрипт загружен, но данные не найдены.</span>');
                    }
                };
                script.onerror = () => showResult('<span class="error">✗ Ошибка загрузки скрипта.</span>');
                document.body.appendChild(script);
            }
            else if (m === 4) {
                // Метод 4: LocalStorage
                const cached = localStorage.getItem('orcid_cache');
                if (cached) {
                    const data = JSON.parse(cached);
                    const time = (performance.now() - startTime).toFixed(1);
                    showResult('<span class="success">✓ Успех (LocalStorage)!</span>\nПубликаций: ' + data.group.length + '\nВремя: ' + time + 'мс');
                } else {
                    showResult('<span class="error">✗ В LocalStorage пусто.</span>\nСначала используйте метод 3, чтобы загрузить и сохранить данные.');
                }
            }
            else if (m === 5) {
                // Метод 5: Iframe (Синхронный)
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = './orcid_works.json';
                iframe.onload = () => {
                    const time = (performance.now() - startTime).toFixed(1);
                    try {
                        const text = iframe.contentDocument.body.innerText;
                        const data = JSON.parse(text);
                        showResult('<span class="success">✓ Успех (Iframe)!</span>\nПубликаций: ' + data.group.length + '\nВремя: ' + time + 'мс');
                    } catch(e) {
                        showResult('<span class="error">✗ Ошибка (Iframe заблокирован политикой CORS):</span>\n' + e.message);
                    }
                    iframe.remove();
                };
                iframe.onerror = () => showResult('<span class="error">✗ Iframe не смог загрузить файл.</span>');
                document.body.appendChild(iframe);
            }
        }

        // Автоматически запускаем метод, если передан в URL (?m=1)
        const urlParams = new URLSearchParams(window.location.search);
        const m = urlParams.get('m');
        if (m) {
            setTimeout(() => run(parseInt(m)), 100);
        }
    </script>
</body>
</html>
