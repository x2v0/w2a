<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Темный фон -->
  <rect width="512" height="512" rx="100" fill="#121212"/>
  
  <!-- Синий акцент (полоска снизу, как на сайте) -->
  <rect x="100" y="380" width="312" height="12" rx="6" fill="#0288d1"/>
  
  <!-- Текст: RESUME -->
  <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="800" fill="#ffffff" letter-spacing="-2">
    RESUME
  </text>
  
  <!-- Маленькая синяя точка (акцент) -->
  <circle cx="400" cy="140" r="20" fill="#0288d1"/>
</svg>
