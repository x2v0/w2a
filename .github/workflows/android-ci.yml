# go-patch-5
# go-patch-2
name: Android CI Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.mod

      - name: Build Go tools
        working-directory: go
        run: make build

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Run checks
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PskipShellTemplateSync=true \
            -PallowDebugSignedRelease=true \
            :app:compileStandardDebugKotlin \
            :shell:compileDebugKotlin

          ./go/bin/wta-checkdrift

  package-apks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.mod

      - name: Build Go tools
        working-directory: go
        run: make build

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Build musl-bridge (Go)
        working-directory: go
        run: |
          ./bin/wta-muslbridge \
            -ndk "$ANDROID_HOME/ndk/29.0.14206865" \
            -work ../app/build/musl-bridge \
            -out ../app/build/generated/jniLibs/muslBridge \
            -patch ../scripts/patches/musl-1.2.5-wta-exec-bridge.patch \
            -shim ../scripts/musl-bridge/wta_mulxc3.c

      - name: Smoke test wta-buildapk
        run: |
          if [ -f app/src/main/assets/template/webview_shell.apk ]; then
            ./go/bin/wta-buildapk \
              -template app/src/main/assets/template/webview_shell.apk \
              -url https://example.com \
              -app-name "Smoke Test" \
              -package com.smoketest.app \
              -out build/wta-smoke.apk
            unzip -l build/wta-smoke.apk | head -5
          else
            echo 'shell-template.apk not present - skipping smoke test'
          fi

      - name: Upload wta-buildapk smoke artifact
        if: hashFiles('build/wta-smoke.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wta-buildapk-smoke-${{ github.run_number }}
          path: build/wta-smoke.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Build standard debug APK
        env:
          WTA_MUSL_PREBUILT: "1"
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleStandardDebug

      - name: Build standard release APK
        env:
          WTA_MUSL_PREBUILT: "1"
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleStandardRelease

      - name: Build gplay debug APK
        env:
          WTA_MUSL_PREBUILT: "1"
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleGplayDebug

      - name: Build gplay release APK
        env:
          WTA_MUSL_PREBUILT: "1"
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleGplayRelease

      - name: Upload standard APKs
        uses: actions/upload-artifact@v4
        with:
          name: standard-apks-DEBUG-SIGNED-do-not-distribute-${{ github.run_number }}
          path: |
            app/build/outputs/apk/standard/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload gplay APKs
        uses: actions/upload-artifact@v4
        with:
          name: gplay-apks-shiaho.webtoapp-DEBUG-SIGNED-do-not-distribute-${{ github.run_number }}
          path: app/build/outputs/apk/gplay/**/*.apk
          if-no-files-found: warn
          retention-days: 14
          
