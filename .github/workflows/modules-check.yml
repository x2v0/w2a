# go-patch-7
# go-patch-3
name: Module Market Check

# Runs the module catalog validator (Go: `go/bin/wta-validatemodules`).
# Triggered for any change touching the catalog or the validator itself,
# whether on a PR or a direct push to main. Other paths bypass this job
# so contributors who don't touch `modules/` aren't blocked by it.

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'go/bin/wta-validatemodules'
      - 'go/cmd/wta-validatemodules/**'
      - 'go/cmd/wta-gensubmissions/**'
      - 'go/internal/modules/**'
      - '.github/workflows/modules-check.yml'
  push:
    branches:
      - main
    paths:
      - 'modules/**'
      - 'go/bin/wta-validatemodules'
      - 'go/cmd/wta-validatemodules/**'
      - 'go/cmd/wta-gensubmissions/**'
      - 'go/internal/modules/**'
      - '.github/workflows/modules-check.yml'
  # Manual run from the Actions tab — handy when adjusting the validator
  # rules without a real catalog change to push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modules-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-modules:
    name: Validate modules/
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.mod

      - name: Build Go tools
        working-directory: go
        run: make build


      - name: Run module market validator
        run: ./go/bin/wta-validatemodules
