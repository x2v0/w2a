# --- JVM / Gradle memory ---
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Gradle execution (CI-friendly) ---
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
org.gradle.configuration-cache=false

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1g

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.disableJdkImageTransform=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.lint.checkReleaseBuilds=false

# --- AGP 9 compatibility (важно, иначе конфликт extension 'kotlin') ---
android.builtInKotlin=false
android.newDsl=false
